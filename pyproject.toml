[project]
name = "lumina-player"
version = "0.2.0"
description = "Lumina Player - Mac 本地视频播放器（硬解/软解、多音轨字幕、默认语言、AI 转写与翻译）"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
offline = [
    "argostranslate>=0.4.1",
]

[project.scripts]
lumina = "lumina.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumina"]
